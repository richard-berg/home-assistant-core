rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register custom service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not register custom service actions.
  docs-high-level-description: todo
  docs-installation-instructions: todo
  docs-removal-instructions: todo
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: This integration does not register custom service actions.
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: |
      Discovery is user-initiated via serial/IP enumeration, not
      passive network events like SSDP or mDNS.
  discovery:
    status: exempt
    comment: |
      The controller is reached via direct serial or IP2SL links.
      No standard HA discovery mechanism (Zeroconf, SSDP, etc.) applies.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Each config entry controls exactly one masking screen controller.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: Each config entry controls exactly one masking screen controller.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: |
      Communication uses serial or raw TCP sockets via seymourlib,
      not HTTP sessions.
  strict-typing: done
